format = """$custom.sys_telemetry
$character"""

add_newline = false

[custom.sys_telemetry]
command = "echo -ne '\\033[1;34m//SYS.LOC:\\033[0m \\033[1;36m~\\033[0m \\033[1;34m//NODE:\\033[0m \\033[1;36mHYPEROID\\033[0m \\033[1;34m//TIME:\\033[0m \\033[1;36m'$(date +%T)'\\033[0m'"
when = "true"
shell = ["bash", "--noprofile", "--norc"]
format = "$output\n"

[character]
success_symbol = "[>> ACCESS//_](bold green) "
error_symbol = "[>> ACCESS_DENIED//!](bold red) "
