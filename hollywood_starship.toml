# ==============================================================================
# HYPEROID // TACTICAL CYBERDECK STARSHIP CONFIGURATION
# ==============================================================================

format = """
[┌──](bold cyan)$username$hostname$directory$git_branch$git_status$python$custom_battery
[└──▶](bold cyan) """

right_format = """$cmd_duration$time"""

add_newline = false

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold yellow"
format = "[@HYPEROID-C2]($style) "

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
format = "in [$path]($style) "

[git_branch]
symbol = "⚡ "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"

[python]
symbol = "🐍 "
style = "bold green"
format = "via [$symbol$version]($style) "

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "took [$duration]($style) "

[time]
disabled = false
time_format = "%T"
style = "bold bright-black"
format = "at [$time]($style)"

[custom_battery]
command = "termux-battery-status 2>/dev/null | jq -r '.percentage // empty' | awk '{print \"🔋\"$1\"%\"}'"
when = "which termux-battery-status"
style = "bold green"
format = "[$output]($style) "
